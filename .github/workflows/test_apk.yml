name: Test APK

# Builds an installable test APK of the reliable groups branch and publishes it
# as the "test-build" pre-release, so testers download it on the phone.
on:
  push:
    branches:
      - claude/eloquent-planck-1a5ky1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      # Updates only install over an APK signed with the same key, so the test
      # build signs with its own keystore, created once and kept in the cache.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/test-signing
          key: test-apk-signing-v2
      - name: Configure signing
        run: |
          mkdir -p ~/test-signing
          if [ ! -f ~/test-signing/test.jks ]; then
            keytool -genkeypair -v -keystore ~/test-signing/test.jks \
              -storepass testbuild -keypass testbuild -alias test \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=MeshCore Gruppen Test"
          fi
          cat > android/key.properties <<PROPS
          storeFile=$HOME/test-signing/test.jks
          storePassword=testbuild
          keyAlias=test
          keyPassword=testbuild
          PROPS
      # A separate app id and name, so the test build installs next to an
      # existing MeshCore Open instead of replacing it.
      - name: Rename test app
        run: |
          sed -i 's/applicationId = "com.meshcore.meshcore_open"/applicationId = "com.meshcore.meshcore_open.groups"/' android/app/build.gradle.kts
          sed -i 's/android:label="MeshCore Open"/android:label="MeshCore Gruppen"/' android/app/src/main/AndroidManifest.xml
          grep -q 'com.meshcore.meshcore_open.groups' android/app/build.gradle.kts
      - run: flutter pub get
      # Phones only need arm64; the default build adds armv7 and x86_64 too.
      - run: flutter build apk --release --no-pub --target-platform android-arm64
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk meshcore-gruppen.apk
          # Shown in the notes: an unchanged value means updates install in place.
          SIGNATURE=$(keytool -list -v -keystore ~/test-signing/test.jks \
            -storepass testbuild -alias test | grep -m1 'SHA256:' | awk '{print $2}' | cut -c1-23)
          gh release delete test-build --cleanup-tag --yes || true
          gh release create test-build meshcore-gruppen.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Testversion Gesicherte Gruppen" \
            --notes "Stand: ${GITHUB_SHA::7} vom $(date -u '+%d.%m.%Y %H:%M') UTC. Auf dem Handy meshcore-gruppen.apk antippen und installieren. Signatur: ${SIGNATURE}"
